[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"
# format code
tidy  = "xtask tidy"
# Last command before submitting a PR
commit = "xtask commit"
# Github Actions CI
ci = "xtask ci"
# nightly(#[ignore]) test
nightly = "xtask nightly"
# Check for uncommitted changes
check-uncommitted = "xtask check-uncommitted"
# Check License header
license-check = "xtask license-check"
# Using Cargo nexttest instead of Cargo test
nextest-run = "xtask nextest-run"
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-ld_classic"]
