[profile.default]
# Non-release runs keep the original thresholds: SLOW is only a warning at 60
# seconds, and nextest terminates the test as TIMEOUT at 360 seconds.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 6, grace-period = "30s" }
test-threads = "num-cpus"
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"

[profile.ci]
# Jenkins uses this profile only for release tests. Mark an individual test as
# SLOW after 30 seconds and terminate it as TIMEOUT after 60 seconds.
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "30s" }

[[profile.ci.overrides]]
# These Java-aligned randomized WAND tests perform hundreds of full score and
# max-score checks. Some valid seeds need more than the general 60-second CI
# limit even in release mode.
filter = '''
test(=test::core::search::test_wand_scorer::test_random)
| test(=test::core::search::test_wand_scorer::test_random_with_infinite_max_score)
| test(=test::core::search::test_wand_scorer::test_random_with_max_score_overflow)
'''
slow-timeout = { period = "30s", terminate-after = 6, grace-period = "30s" }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
