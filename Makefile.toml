[tasks.check]
description = "Code format"
dependencies = ["check-rust-version","clippy", "fix","format"]

[tasks.ci]
description = "Run ci"
dependencies = ["check-rust-version","clippy","fix", "format", "check-uncommitted","test"]

[tasks.format]
command = "cargo"
args = ["fmt"]

[tasks.clippy]
command = "cargo"
#args = ["clippy", "--fix", "--", "-D", "warnings"]
args = ["clippy", "--fix"]

[tasks.fix]
command = "cargo"
#args = ["clippy", "--fix", "--", "-D", "warnings"]
args = ["fix", "--allow-dirty", "--allow-staged"]

[tasks.test]
command = "cargo"
args = ["test", "--verbose", "--features", "test_log_verbose,nightly"]

[tasks.check-uncommitted]
description = "Check for uncommitted changes using Rust script"
script_runner = "@rust"
script = [
    '''
    fn main() {
        let output = std::process::Command::new("git")
            .args(["status", "--porcelain"])
            .output()
            .expect("failed to execute git");
        let stdout = String::from_utf8_lossy(&output.stdout);
        if stdout.trim().is_empty() {
            println!("✅ Working directory clean. All changes committed.");
        } else {
            eprintln!("❌ Uncommitted changes detected. Please commit your work first.");
            eprintln!("{}", stdout);
            std::process::exit(1);
        }
    }
    '''
]

[tasks.check-rust-version]
description = "Ensure exact Rust version"
script_runner = "@rust"
script = [
    '''
    fn main() {
        let version = std::process::Command::new("rustc")
            .arg("--version")
            .output()
            .expect("failed to execute rustc");

        let stdout = String::from_utf8_lossy(&version.stdout);
        if !stdout.contains("1.84.0") {
            eprintln!("❌ Rust version mismatch: expected 1.84.0, got: {}", stdout);
            std::process::exit(1);
        } else {
            println!("✅ Rust version OK: {}", stdout);
        }
    }
    '''
]
