services:
  jenkins:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: ci/jenkins/deployment/Dockerfile
      args:
        JENKINS_BASE_IMAGE: ${JENKINS_BASE_IMAGE:-jenkins/jenkins:2.568.3-jdk21@sha256:c1e4c349365f6d16d88595b2c5f7e8ff39b8ae1d061f62420bac193b4b9616d0}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://rsproxy.cn}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://rsproxy.cn/rustup}
        CARGO_REGISTRY: ${CARGO_REGISTRY:-sparse+https://rsproxy.cn/index/}
    image: ${JENKINS_IMAGE:-local-jenkins-rust:2.568.3}
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xms2g -Xmx8g}
      TZ: ${TZ:-Asia/Shanghai}
      PLUGINS_FORCE_UPGRADE: ${PLUGINS_FORCE_UPGRADE:-true}
      TRY_UPGRADE_IF_NO_MARKER: ${TRY_UPGRADE_IF_NO_MARKER:-true}
      RLUCENE_REPOSITORY_URL: ${RLUCENE_REPOSITORY_URL:-https://github.com/Rustify-All/rlucene.git}
      RLUCENE_BRANCH: ${RLUCENE_BRANCH:-main}
      RLUCENE_GIT_CREDENTIALS_ID: ${RLUCENE_GIT_CREDENTIALS_ID:-}
      RLUCENE_JOB_NAME: ${RLUCENE_JOB_NAME:-rlucene-ci}
      RLUCENE_JOB_DISABLED: ${RLUCENE_JOB_DISABLED:-false}
      RLUCENE_PUBLIC_READ_ONLY: ${RLUCENE_PUBLIC_READ_ONLY:-false}
      RLUCENE_ADMIN_USERS: ${RLUCENE_ADMIN_USERS:-}
      RLUCENE_FAILURE_EMAIL: ${RLUCENE_FAILURE_EMAIL:-}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
