name: Jenkins PR test-light

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: jenkins-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-light:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check repository permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/collaborators/${PR_AUTHOR}/permission")"
          permission="$(jq -er '.permission' <<<"${response}")"

          case "${permission}" in
            admin|write)
              echo "allowed=true" >> "${GITHUB_OUTPUT}"
              echo "permission=${permission}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "allowed=false" >> "${GITHUB_OUTPUT}"
              echo "PR author ${PR_AUTHOR} has ${permission} permission; Jenkins was not started."
              ;;
          esac

      - name: Skip untrusted PR
        if: steps.permission.outputs.allowed != 'true'
        run: echo "Only repository members with write or admin permission run cargo test-light."

      - name: Run cargo test-light in Jenkins
        if: steps.permission.outputs.allowed == 'true'
        env:
          JENKINS_URL: https://jenkins.amazingkoala.com.cn
          JENKINS_USER: ${{ secrets.JENKINS_PR_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_PR_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_PERMISSION: ${{ steps.permission.outputs.permission }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JENKINS_USER}" || -z "${JENKINS_TOKEN}" ]]; then
            echo "Jenkins trigger credentials are not configured." >&2
            exit 1
          fi

          work_dir="$(mktemp -d)"
          build_url=""
          build_finished=false
          cleanup() {
            if [[ -n "${build_url}" && "${build_finished}" != "true" ]]; then
              curl --silent --show-error \
                --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
                --request POST \
                --output /dev/null \
                "${build_url}stop" || true
            fi
            rm -rf "${work_dir}"
          }
          preserve_latest_pr_build() {
            local current_number keep_log builds_json older_build_url
            current_number="$(jq -er '.number' <<<"${build_json}")" || {
              echo "Warning: Jenkins did not return the current build number; older retained builds were left unchanged." >&2
              return
            }
            keep_log="$(jq -r '.keepLog // "unknown"' <<<"${build_json}")" || {
              echo "Warning: Jenkins did not return the current retention state; older retained builds were left unchanged." >&2
              return
            }
            if [[ "${keep_log}" != "true" && "${keep_log}" != "false" ]]; then
              echo "Warning: Jenkins returned an invalid retention state; older retained builds were left unchanged." >&2
              return
            fi

            if [[ "${keep_log}" != "true" ]]; then
              if ! curl --fail --silent --show-error \
                --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
                --request POST \
                --output /dev/null \
                "${build_url}toggleLogKeep"; then
                echo "Warning: unable to protect the latest Jenkins build for PR #${PR_NUMBER}." >&2
                return
              fi
            fi

            builds_json="$(curl --fail --silent --show-error \
              --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
              --get \
              --data-urlencode 'tree=builds[number,url,keepLog,actions[parameters[name,value]]]{0,500}' \
              "${JENKINS_URL}/job/rlucene-pr/api/json")" || {
                echo "Warning: unable to list Jenkins builds; older retained builds were left unchanged." >&2
                return
              }

            while IFS= read -r older_build_url; do
              [[ -n "${older_build_url}" ]] || continue
              if ! curl --fail --silent --show-error \
                --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
                --request POST \
                --output /dev/null \
                "${older_build_url}toggleLogKeep"; then
                echo "Warning: unable to release an older retained build for PR #${PR_NUMBER}." >&2
              fi
            done < <(jq -r \
              --arg pr_number "${PR_NUMBER}" \
              --argjson current_number "${current_number}" \
              '.builds[]
                | select(.number != $current_number and .keepLog == true)
                | select(any(.actions[]?.parameters[]?;
                    .name == "PR_NUMBER" and (.value | tostring) == $pr_number))
                | .url + "toggleLogKeep"' \
              <<<"${builds_json}")
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          headers="${work_dir}/headers"
          status="$(curl --silent --show-error \
            --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            --request POST \
            --dump-header "${headers}" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --data-urlencode "PR_NUMBER=${PR_NUMBER}" \
            --data-urlencode "PR_HEAD_SHA=${PR_HEAD_SHA}" \
            --data-urlencode "PR_AUTHOR=${PR_AUTHOR}" \
            --data-urlencode "PR_PERMISSION=${PR_PERMISSION}" \
            "${JENKINS_URL}/job/rlucene-pr/buildWithParameters")"
          if [[ "${status}" != "201" ]]; then
            echo "Jenkins rejected the build request with HTTP ${status}." >&2
            exit 1
          fi

          queue_url="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' "${headers}")"
          if [[ -z "${queue_url}" ]]; then
            echo "Jenkins did not return a queue URL." >&2
            exit 1
          fi
          if [[ "${queue_url}" == /* ]]; then
            queue_url="${JENKINS_URL}${queue_url}"
          fi

          for _ in $(seq 1 480); do
            queue_json="$(curl --fail --silent --show-error \
              --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
              "${queue_url}api/json")"
            if [[ "$(jq -r '.cancelled // false' <<<"${queue_json}")" == "true" ]]; then
              echo "The Jenkins queue item was cancelled." >&2
              exit 1
            fi
            build_url="$(jq -r '.executable.url // empty' <<<"${queue_json}")"
            [[ -n "${build_url}" ]] && break
            sleep 5
          done
          if [[ -z "${build_url}" ]]; then
            echo "Timed out waiting for Jenkins to start the build." >&2
            exit 1
          fi
          echo "Jenkins build: ${build_url}"
          printf 'Jenkins build: [%s](%s)\n' "${build_url}" "${build_url}" >> "${GITHUB_STEP_SUMMARY}"

          for _ in $(seq 1 420); do
            build_json="$(curl --fail --silent --show-error \
              --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
              "${build_url}api/json?tree=number,building,result,url,keepLog")"
            if [[ "$(jq -r '.building' <<<"${build_json}")" == "false" ]]; then
              result="$(jq -r '.result' <<<"${build_json}")"
              build_finished=true
              preserve_latest_pr_build
              echo "Jenkins result: ${result}"
              printf '\nResult: **%s**\n' "${result}" >> "${GITHUB_STEP_SUMMARY}"
              [[ "${result}" == "SUCCESS" ]]
              exit
            fi
            sleep 5
          done

          echo "Timed out waiting for the Jenkins build result." >&2
          exit 1
