name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.84.0
          override: true

      - name: Cache cargo-make binary
        uses: actions/cache@v3
        id: cache-cargo-make
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-v0.37.24
          restore-keys: |
            ${{ runner.os }}-cargo-make-

      - name: Install cargo-make if missing
        run: |
          if [ ! -f ~/.cargo/bin/cargo-make ]; then
            echo "❯ Installing cargo-make v0.37.24..."
            cargo install cargo-make --locked --version 0.37.24
          else
            echo "✔ cargo-make already installed, skipping"
          fi

      - name: Run full CI pipeline via cargo-make
        run: cargo make ci
