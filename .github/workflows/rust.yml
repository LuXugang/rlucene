name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
           toolchain: 1.84.0
           override: true
#      - name: Generate Random Seed
#        run: |
#          echo "Generating random seed with Rust..."
#          RANDOM_SEED=$(cargo run --example generate_seed | tail -n 1)
#          echo "tests.seed=$RANDOM_SEED" >> $GITHUB_ENV
#          echo "Generated Random Seed: $RANDOM_SEED"
#      - name: Log Random Seed
#        run: |
#          echo "Random Seed: $tests.seed"
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose --features test_log_verbose,nightly