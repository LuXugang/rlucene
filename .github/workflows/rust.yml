name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_MAKE_VERSION: 0.37.24
      RUST_TOOLCHAIN: 1.89.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true

      - name: Cache cargo-make binary
        uses: actions/cache@v3
        id: cache-cargo-make
        with:
          path: ~/.cargo/bin/cargo-make
          key: ${{ runner.os }}-cargo-make-v${{ env.CARGO_MAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-make-

      - name: Install cargo-make if missing
        run: |
          if [ ! -f ~/.cargo/bin/cargo-make ]; then
            echo "❯ Installing cargo-make v${CARGO_MAKE_VERSION}..."
            cargo install cargo-make --locked --version $CARGO_MAKE_VERSION
          else
            echo "✔ cargo-make already installed, skipping"
          fi

      - name: Run full CI pipeline via cargo-make
        run: cargo make ci
