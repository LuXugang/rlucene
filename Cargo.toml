[package]
name = "rlucene"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
crc32fast = "1.3"
byteorder = "1.5.0"
thiserror = "1.0.69"

[dev-dependencies]
rand = "0.8.5"
bit-set = "0.5.3"
rand_xoshiro = "0.6.0"

[profile.dev]
overflow-checks = false

[features]
default= ["test_only", "not_required_in_rlucene"]
test_only = []
not_required_in_rlucene = []

