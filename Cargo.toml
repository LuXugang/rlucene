[package]
name = "rlucene"
version = "0.1.0"
edition = "2024"
license ="Apache-2.0"
rust-version = "1.89.0"

[dependencies]
derive_getters = { path = "libs/derive_getters" }
crc32fast = "1.5.0"
byteorder = "1.5.0"
thiserror = "2.0.13"
num-bigint = "0.4.6"
regex = { version = "1.11.1", default-features = false, features = ["std", "unicode"] }
once_cell = "1.21.3"
rand = "0.9.2"
fs2 = "0.4.3"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
num-traits = "0.2.19"
flate2 = { version = "1.1.0", default-features = false, features = ["rust_backend"] }
strum = "0.27.1"
strum_macros = "0.27.1"
parking_lot = "0.12.4"
bit-set = "0.8.0"
rand_chacha = "0.9.0"
os_info = "3.12.0"

[dev-dependencies]
rand_xoshiro = "0.7.0"
tempfile = "3.20.0"
num-integer="0.1.46"

[profile.dev]
overflow-checks = false

[features]
default= ["test_only", "not_required_in_rust_lucene"]
test_only = []
not_required_in_rust_lucene = []
test_log_verbose = []
nightly = []
[workspace]
members = [
    ".",
    "libs/derive_getters",
]