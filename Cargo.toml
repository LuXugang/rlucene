[package]
name = "rlucene"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
derive_getters = { path = "libs/derive_getters" }
crc32fast = "1.3"
byteorder = "1.5.0"
thiserror = "1.0.69"
num-bigint = "0.4"
regex = "1.11.1"
lazy_static = "1.5.0"
rand = "0.8.5"
fs2 = "0.4.3"
chrono = "0.4.39"
num-traits = "0.2.19"

[dev-dependencies]
bit-set = "0.5.3"
rand_xoshiro = "0.6.0"
tempfile = "3.14.0"

[profile.dev]
overflow-checks = false

[features]
default= ["test_only", "not_required_in_rlucene", "wait_other_impl"]
test_only = []
not_required_in_rlucene = []
wait_other_impl = []
nightly = []
test_log_verbose = []
[workspace]
members = [
    ".",
    "libs/derive_getters",
]
